name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint
        run: find src examples tests autoload.php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests
        run: make test

      - name: VERSION is semver
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
